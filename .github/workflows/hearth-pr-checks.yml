# Zero-token backstop for the Hearth per-change checklist.
#
# Both jobs below just run scripts that live in the repo — the mechanical
# checks used to be a ~90-line inline shell block here AND a prose checklist
# in .claude/agents/hearth-verifier.md, two hand-maintained copies of the same
# rules that had already drifted (the document-doubling tripwire was 1.4x here
# and 1.25x there). tests/checks.sh is now the single implementation; this
# workflow and the verifier subagent both call it. Do not re-inline checks.
#
# To make a red ✗ actually BLOCK merging, add a branch-protection rule on main
# requiring the "Hearth checks" status (repo → Settings → Branches).
name: Hearth checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hearth-checks:
    name: Hearth checks
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4

      # actions/checkout leaves no local `main` and no origin/main, so fetch
      # the base explicitly and hand checks.sh the resulting FETCH_HEAD. That
      # makes the base unambiguous in CI rather than relying on the script's
      # local-convenience resolution.
      - name: Fetch base branch
        run: git fetch --quiet --depth=1 origin "$BASE_REF"

      - name: Mechanical checks
        run: tests/checks.sh FETCH_HEAD

      - name: Behaviour tests
        run: CHROME_BIN="$(command -v google-chrome || command -v chromium-browser)" node tests/run.js
