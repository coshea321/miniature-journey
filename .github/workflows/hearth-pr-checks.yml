# Zero-token backstop for the Hearth per-change checklist: re-runs the
# hearth-verifier subagent's mechanical checks on every PR. To make a red ✗
# actually BLOCK merging, add a branch-protection rule on main requiring
# the "Hearth checks" status (repo → Settings → Branches).
name: Hearth checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hearth-checks:
    name: Hearth checks
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify index.html + sw.js
        run: |
          set -uo pipefail
          fail=0
          err(){ echo "::error::$1"; fail=1; }

          # 1. Syntax-check the main inline script block:
          #    from the "// PREVIEW MODE" comment to the FIRST </script>
          #    AT OR AFTER it (the DOMPurify tag closes earlier; a literal
          #    </script> never appears inside JS strings - the print-doc
          #    uses the escaped <\/script> form).
          START=$(grep -n '// PREVIEW MODE' index.html | head -1 | cut -d: -f1)
          if [ -z "${START}" ]; then
            err "'// PREVIEW MODE' marker not found in index.html"
          else
            END=$(awk -v s="$START" 'NR>=s && /<\/script>/{print NR; exit}' index.html)
            sed -n "${START},$((END-1))p" index.html > /tmp/hearth-block.js
            if node --check /tmp/hearth-block.js; then
              echo "node --check OK (lines $START-$((END-1)))"
            else
              err "node --check failed on the main script block"
            fi
          fi

          # 2. File structure
          [ "$(grep -ci '<!doctype' index.html)" = "2" ] \
            || err "DOCTYPE count != 2 (expect one real + one in the print-doc string)"
          [ "$(grep -c '<html lang' index.html)" = "1" ] \
            || err "html-lang count != 1"
          [ "$(grep -cE 'v[0-9]{3} · [0-9]{2}/[0-9]{2}/[0-9]{4}' index.html)" = "1" ] \
            || err "in-file version label count != 1"
          BYTES=$(wc -c < index.html)
          echo "index.html is $BYTES bytes"
          # A doubling tripwire, not a size budget: the v221 incident duplicated
          # the whole document in one edit. Measured against the base branch
          # rather than a fixed ceiling (which v379 grew into at 902KB, going
          # red on ordinary growth), so this number never needs touching again.
          git fetch --quiet --depth=1 origin "$BASE_REF"
          BASE_BYTES=$(git show FETCH_HEAD:index.html | wc -c)
          echo "index.html on $BASE_REF is $BASE_BYTES bytes"
          if [ "$BASE_BYTES" -lt 1000 ]; then
            err "could not read index.html from $BASE_REF (got $BASE_BYTES bytes)"
          else
            [ "$BYTES" -lt "$(( BASE_BYTES * 14 / 10 ))" ] \
              || err "index.html is $BYTES bytes vs $BASE_BYTES on $BASE_REF (over 1.4x) - v221-style document doubling?"
          fi
          tail -c 40 index.html | tr -d '[:space:]' | grep -q '</body></html>$' \
            || err "index.html does not end cleanly with </body></html>"

          # 3. sw.js is the single source of truth - index.html must match it
          SWV=$(grep -oE 'v[0-9]{3} · [0-9]{2}/[0-9]{2}/[0-9]{4}' sw.js | head -1)
          HTMLV=$(grep -oE 'v[0-9]{3} · [0-9]{2}/[0-9]{2}/[0-9]{4}' index.html | head -1)
          echo "sw.js: '$SWV'  index.html: '$HTMLV'"
          [ -n "$SWV" ] || err "no vNNN · DD/MM/YYYY version found in sw.js"
          [ "$SWV" = "$HTMLV" ] || err "version mismatch: sw.js '$SWV' vs index.html '$HTMLV'"

          # 4. If app files changed in this PR, the version must be bumped
          git fetch --quiet --depth=1 origin "$BASE_REF"
          if git diff --quiet FETCH_HEAD -- index.html sw.js; then
            echo "app files unchanged vs $BASE_REF - bump check skipped"
          else
            BASEV=$(git show FETCH_HEAD:sw.js | grep -oE 'v[0-9]{3}' | head -1)
            if [ "$((10#${SWV:1:3}))" -gt "$((10#${BASEV:1:3}))" ]; then
              echo "version bumped: $BASEV -> ${SWV%% *}"
            else
              err "index.html/sw.js changed but version not bumped ($BASEV -> ${SWV%% *})"
            fi
          fi

          # 5. Dosing literal pins — "never silently change strengths or
          #    formulas" (CLAUDE.md), made mechanical. Any PR touching these
          #    goes red until the greps are deliberately updated.
          [ "$(grep -c "data-mgkg='15' data-mg5='120'" index.html)" = "1" ] \
            || err "Calpol dosing constants changed unexpectedly (data-mgkg='15' data-mg5='120')"
          [ "$(grep -c "data-mgkg='10' data-mg5='100'" index.html)" = "1" ] \
            || err "Nurofen dosing constants changed unexpectedly (data-mgkg='10' data-mg5='100')"
          [ "$(grep -c "data-floor='5'" index.html)" = "1" ] \
            || err "Nurofen under-5kg floor constant changed unexpectedly (data-floor='5')"
          [ "$(grep -cF 'Math.floor((w*mgkg*5/mg5)*4)/4' index.html)" = "1" ] \
            || err "dose formula string changed unexpectedly"
          [ "$(grep -c 'check the leaflet' index.html)" -ge "4" ] \
            || err "'check the leaflet' safety wording count dropped below 4"

          # 6. Duplicate top-level function names: a hoisting-shadowed
          #    duplicate is a silent no-op no test can see, a grep can.
          #    The pre-existing workout-session duplicate region was removed
          #    in v351 (all 24 pairs verified byte-identical before deletion),
          #    so the allowlist is empty — ANY duplicate fails the build.
          ALLOWLISTED_DUPES=""
          DUPES=$(grep -oE '^function [A-Za-z0-9_]+' index.html | awk '{print $2}' | sort | uniq -d)
          NEW_DUPES=""
          for d in $DUPES; do
            case " $ALLOWLISTED_DUPES " in
              *" $d "*) ;;
              *) NEW_DUPES="$NEW_DUPES $d" ;;
            esac
          done
          [ -z "$NEW_DUPES" ] || err "new duplicate function name(s) found (hoisting risk):$NEW_DUPES"

          exit $fail

      - name: Behaviour tests
        run: CHROME_BIN="$(command -v google-chrome || command -v chromium-browser)" node tests/run.js
